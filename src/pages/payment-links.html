---
layout: bare
title: Payment Links | Build Boosters
description: Build Boosters payment links by plan.
robots: noindex, nofollow
chat: false
tracking: false
sitemap: false
---
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--main:#0b2440;--accent:#f2a20c;--fg:#121a24;--muted:#5b6878;--line:#e4e9ef;--soft:#f3f5f8}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font:16px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:48px 20px 80px}
h1{margin:0 0 6px;font-size:32px;line-height:1.1;letter-spacing:-.02em;color:var(--main)}
.sub{margin:0 0 32px;color:var(--muted)}
.plan{padding:24px 0;border-top:1px solid var(--line)}
.plan h2{margin:0;font-size:22px;letter-spacing:-.01em;color:var(--main)}
.plan p{margin:4px 0 16px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0}
.row + .row{border-top:1px dashed var(--line)}
.what{flex:1 1 220px}
.what b{display:block}
.what span{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 14px/1 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px 18px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;background:var(--accent);color:#16191d}
.btn.line{background:transparent;color:var(--main);box-shadow:inset 0 0 0 1.5px var(--main)}
.none{color:var(--muted);font-size:14px}
</style>
<main>
  <h1>Payment links</h1>
  <p class="sub">Every plan's checkout link in one place. Open a link to check it, or copy it to send to a client.</p>
  <div id="plans"></div>
</main>
<script>
// To add or change a link, edit the url below and push. An empty url shows as "Link not added yet".
var PLANS = [
  { name: 'Foundation', who: 'The solo contractor who needs to look legit and stop missing calls.', links: [
    { label: 'Monthly', price: '$147 a month plus $500 setup', url: '' },
    { label: 'Yearly', price: '$1,470 a year, setup waived', url: '' }
  ] },
  { name: 'Momentum', who: 'The growing crew that wants more reviews and customers coming back.', links: [
    { label: 'Monthly', price: '$297 a month plus $500 setup', url: '' },
    { label: 'Yearly', price: '$2,970 a year, setup waived', url: '' }
  ] },
  { name: 'Dominance', who: 'The established company that wants to be found first.', links: [
    { label: 'Monthly', price: '$497 a month plus $297 setup', url: 'https://buy.stripe.com/8x214ngigabY4jM5Zu1wY02' },
    { label: 'Yearly', price: '$4,970 a year, setup waived', url: '' }
  ] }
];
(function () {
  var root = document.getElementById('plans');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  PLANS.forEach(function (plan) {
    var box = el('section', 'plan');
    box.appendChild(el('h2', '', plan.name));
    box.appendChild(el('p', '', plan.who));
    plan.links.forEach(function (link) {
      var row = el('div', 'row');
      var what = el('div', 'what');
      what.appendChild(el('b', '', link.label));
      what.appendChild(el('span', '', link.price));
      row.appendChild(what);
      if (/^https:\/\//.test(link.url)) {
        var open = el('a', 'btn', 'Open');
        open.href = link.url; open.target = '_blank'; open.rel = 'noopener';
        var copy = el('button', 'btn line', 'Copy link');
        copy.type = 'button';
        copy.addEventListener('click', function () {
          var done = function () { copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy link'; }, 1500); };
          if (navigator.clipboard) navigator.clipboard.writeText(link.url).then(done, function () { window.prompt('Copy this link', link.url); });
          else window.prompt('Copy this link', link.url);
        });
        row.appendChild(open); row.appendChild(copy);
      } else {
        row.appendChild(el('span', 'none', 'Link not added yet'));
      }
      box.appendChild(row);
    });
    root.appendChild(box);
  });
})();
</script>
